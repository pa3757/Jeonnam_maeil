<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PAGE_TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#2b2c30; --panel:#36373c; --panel-2:#414247; --line:#4d4e54;
  --text:#f2f2f3; --muted:#a9aab0; --accent:#ff4e33; --yellow:#ffcd4a; --green:#75a05b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
/* header */
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:#25262a}
.dots{display:flex;gap:6px;flex:none}
.dots i{width:11px;height:11px;border-radius:50%;display:block}
.dots i:nth-child(1){background:var(--accent)}.dots i:nth-child(2){background:var(--yellow)}.dots i:nth-child(3){background:var(--green)}
.title{min-width:0;flex:1;display:flex;flex-direction:column}
.title b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex:none}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:#fff;background:#4a2e2a}
.btn svg{width:16px;height:16px}
/* stage */
main{position:relative;min-height:0;display:grid}
.stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}
.frame{position:relative;width:min(100%, calc((100dvh - 150px) * 16 / 9));aspect-ratio:16/9;
  border-radius:10px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);background:#6b6c70}
.frame img{width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}
.nav{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;padding:0 10px}
.nav.prev{left:0;justify-content:flex-start}.nav.next{right:0;justify-content:flex-end}
.nav span{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;opacity:0;transition:opacity .15s}
.nav:hover span,.nav:focus-visible span{opacity:1}
.nav[disabled]{cursor:default}.nav[disabled] span{display:none}
/* footer */
footer{display:flex;align-items:center;gap:12px;padding:8px 16px 12px}
.count{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);flex:none;min-width:64px}
.bar{flex:1;height:4px;background:var(--panel);border-radius:4px;overflow:hidden;cursor:pointer}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.hint{font-size:12px;color:var(--muted);flex:none}
/* grid overlay */
.grid{position:fixed;inset:0;background:#1e1f22;z-index:10;display:none;flex-direction:column}
.grid.open{display:flex}
.grid-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.grid-head b{font-size:16px}
.grid-body{overflow:auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.thumb{background:none;border:2px solid transparent;border-radius:10px;padding:0;cursor:pointer;text-align:left}
.thumb img{width:100%;aspect-ratio:16/9;display:block;border-radius:8px;background:#55565b}
.thumb span{display:block;padding:6px 2px 0;font-size:13px;color:var(--muted);line-height:1.35}
.thumb span em{font-style:normal;color:var(--text);font-weight:600;margin-right:6px}
.thumb.cur{border-color:var(--accent)}
.thumb:hover span{color:var(--text)}
.sect{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--yellow);margin-top:6px}
/* fullscreen */
.app.fs header,.app.fs footer{display:none}
.app.fs .stage{padding:0;background:#000}
.app.fs .frame{width:min(100vw, calc(100dvh * 16 / 9));border-radius:0;box-shadow:none}
@media (max-width:760px){
  header{flex-wrap:wrap}
  .title{flex-basis:calc(100% - 60px)}
  .tools{width:100%;overflow-x:auto}
  .btn .lbl{display:none}
  .stage{padding:16px}
  .frame{width:100%}
    .hint{display:none}
  .nav span{opacity:.8;width:36px;height:36px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="title"><b>__DECK_TITLE__</b><span id="slideTitle">__DECK_SUBTITLE__</span></div>
    <div class="tools">
      <button class="btn" id="gridBtn" title="목차 (G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="lbl">목차</span></button>
      <button class="btn" id="fsBtn" title="전체 화면 (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl">전체 화면</span></button>
    </div>
  </header>

  <main>
    <div class="stage" id="stage">
      <div class="frame">
        <img id="slideImg" alt="" src="slides/slide-01.jpg" width="1920" height="1080">
        <button class="nav prev" id="prev" aria-label="이전 슬라이드"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></span></button>
        <button class="nav next" id="next" aria-label="다음 슬라이드"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></span></button>
      </div>
    </div>
  </main>

  <footer>
    <div class="count" id="count">1 / 34</div>
    <div class="bar" id="bar" title="클릭해서 이동"><i id="barFill"></i></div>
    <div class="hint">← → 이동 · G 목차 · F 전체 화면</div>
  </footer>
</div>

<div class="grid" id="grid" role="dialog" aria-label="슬라이드 목차">
  <div class="grid-head"><b>슬라이드 목차</b><button class="btn" id="gridClose">닫기 (Esc)</button></div>
  <div class="grid-body" id="gridBody"></div>
</div>

<script>
const TITLES = __TITLES__;
const SECTIONS = __SECTIONS__;
const N = TITLES.length;
const pad = n => String(n).padStart(2, "0");
const src = n => `slides/slide-${pad(n)}.jpg`;
const $ = id => document.getElementById(id);
let cur = 1;

function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function go(n, push = true){
  n = Math.max(1, Math.min(N, n));
  cur = n;
  const img = $("slideImg");
  img.src = src(n);
  img.alt = `슬라이드 ${n}: ${TITLES[n-1]}`;
  $("slideTitle").textContent = `${n}. ${TITLES[n-1]}`;
  $("count").textContent = `${n} / ${N}`;
  $("barFill").style.width = `${(n / N) * 100}%`;
  $("prev").disabled = n === 1;
  $("next").disabled = n === N;
  document.querySelectorAll(".thumb").forEach(t => t.classList.toggle("cur", +t.dataset.n === n));
  if (push) history.replaceState(null, "", `#${n}`);
  [n+1, n-1].forEach(k => { if (k >= 1 && k <= N) { const p = new Image(); p.src = src(k); } });
}

function buildGrid(){
  const body = $("gridBody");
  let html = "";
  TITLES.forEach((t, i) => {
    const n = i + 1;
    if (SECTIONS[n]) html += `<div class="sect">${esc(SECTIONS[n])}</div>`;
    html += `<button class="thumb" data-n="${n}"><img loading="lazy" src="slides/thumb-${pad(n)}.jpg" alt=""><span><em>${n}</em>${esc(t)}</span></button>`;
  });
  body.innerHTML = html;
  body.addEventListener("click", e => {
    const b = e.target.closest(".thumb"); if (!b) return;
    go(+b.dataset.n); toggleGrid(false);
  });
}

function toggleGrid(force){
  const g = $("grid");
  const open = force ?? !g.classList.contains("open");
  g.classList.toggle("open", open);
  if (open) { const c = g.querySelector(".thumb.cur"); c && c.scrollIntoView({block:"center"}); c && c.focus(); }
}
function toggleFs(){
  const app = $("app");
  if (!document.fullscreenElement) {
    (app.requestFullscreen ? app.requestFullscreen() : Promise.reject()).catch(() => app.classList.toggle("fs"));
  } else document.exitFullscreen();
}
document.addEventListener("fullscreenchange", () => $("app").classList.toggle("fs", !!document.fullscreenElement));

$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
$("gridBtn").onclick = () => toggleGrid();
$("gridClose").onclick = () => toggleGrid(false);
$("fsBtn").onclick = toggleFs;
$("bar").onclick = e => { const r = e.currentTarget.getBoundingClientRect(); go(Math.ceil(((e.clientX - r.left) / r.width) * N)); };

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const gridOpen = $("grid").classList.contains("open");
  switch (e.key) {
    case "ArrowRight": case "PageDown": case " ": if (!gridOpen) { e.preventDefault(); go(cur + 1); } break;
    case "ArrowLeft": case "PageUp": if (!gridOpen) { e.preventDefault(); go(cur - 1); } break;
    case "Home": go(1); break;
    case "End": go(N); break;
    case "g": case "G": toggleGrid(); break;
    case "f": case "F": toggleFs(); break;
    case "Escape": if (gridOpen) toggleGrid(false); else $("app").classList.remove("fs"); break;
  }
});

let tx = null, ty = null;
$("stage").addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
$("stage").addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1));
  tx = ty = null;
});
window.addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1)); if (n && n !== cur) go(n, false); });

document.addEventListener("contextmenu", e => { if (e.target.tagName === "IMG") e.preventDefault(); });
buildGrid();
go(parseInt(location.hash.slice(1)) || 1, false);
</script>
</body>
</html>
