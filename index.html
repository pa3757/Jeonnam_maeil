<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기자를 위한 AI 취재·검증 | 전남매일 AI 특강</title>
<meta name="description" content="전남매일 기자 대상 AI 실무 특강 개념 슬라이드 (ChatGPT × Claude)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#2b2c30; --panel:#36373c; --panel-2:#414247; --line:#4d4e54;
  --text:#f2f2f3; --muted:#a9aab0; --accent:#ff4e33; --yellow:#ffcd4a; --green:#75a05b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
/* header */
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:#25262a}
.dots{display:flex;gap:6px;flex:none}
.dots i{width:11px;height:11px;border-radius:50%;display:block}
.dots i:nth-child(1){background:var(--accent)}.dots i:nth-child(2){background:var(--yellow)}.dots i:nth-child(3){background:var(--green)}
.title{min-width:0;flex:1;display:flex;flex-direction:column}
.title b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex:none}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:#fff;background:#4a2e2a}
.btn svg{width:16px;height:16px}
/* stage */
main{position:relative;min-height:0;display:grid;grid-template-columns:1fr auto}
.stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}
.frame{position:relative;width:min(100%, calc((100dvh - 150px) * 16 / 9));aspect-ratio:16/9;
  border-radius:10px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);background:#6b6c70}
.frame img{width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}
.nav{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;padding:0 10px}
.nav.prev{left:0;justify-content:flex-start}.nav.next{right:0;justify-content:flex-end}
.nav span{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;opacity:0;transition:opacity .15s}
.nav:hover span,.nav:focus-visible span{opacity:1}
.nav[disabled]{cursor:default}.nav[disabled] span{display:none}
/* notes */
.notes{width:min(420px,38vw);border-left:1px solid var(--line);background:#2f3034;overflow:auto;padding:18px 20px;display:none}
.notes.open{display:block}
.notes h2{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 10px;letter-spacing:.02em}
.notes .sec{font-size:12px;font-weight:700;color:var(--yellow);margin:16px 0 6px}
.notes .sec:first-of-type{margin-top:0}
.notes p{margin:0 0 8px;font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:keep-all}
.notes .memo p{font-size:13px;color:var(--muted);line-height:1.65}
/* footer */
footer{display:flex;align-items:center;gap:12px;padding:8px 16px 12px}
.count{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);flex:none;min-width:64px}
.bar{flex:1;height:4px;background:var(--panel);border-radius:4px;overflow:hidden;cursor:pointer}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.hint{font-size:12px;color:var(--muted);flex:none}
/* grid overlay */
.grid{position:fixed;inset:0;background:#1e1f22;z-index:10;display:none;flex-direction:column}
.grid.open{display:flex}
.grid-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.grid-head b{font-size:16px}
.grid-body{overflow:auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.thumb{background:none;border:2px solid transparent;border-radius:10px;padding:0;cursor:pointer;text-align:left}
.thumb img{width:100%;aspect-ratio:16/9;display:block;border-radius:8px;background:#55565b}
.thumb span{display:block;padding:6px 2px 0;font-size:13px;color:var(--muted);line-height:1.35}
.thumb span em{font-style:normal;color:var(--text);font-weight:600;margin-right:6px}
.thumb.cur{border-color:var(--accent)}
.thumb:hover span{color:var(--text)}
.sect{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--yellow);margin-top:6px}
/* fullscreen */
.app.fs header,.app.fs footer{display:none}
.app.fs .stage{padding:0;background:#000}
.app.fs .frame{width:min(100vw, calc(100dvh * 16 / 9));border-radius:0;box-shadow:none}
@media (max-width:760px){
  header{flex-wrap:wrap}
  .title{flex-basis:calc(100% - 60px)}
  .tools{width:100%;overflow-x:auto}
  .btn .lbl{display:none}
  .stage{padding:16px}
  .frame{width:100%}
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .notes{width:auto;border-left:0;border-top:1px solid var(--line);max-height:none}
  .hint{display:none}
  .nav span{opacity:.8;width:36px;height:36px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="title"><b>기자를 위한 AI 취재·검증</b><span id="slideTitle">전남매일 AI 특강</span></div>

      <button class="btn" id="gridBtn" title="목차 (G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="lbl">목차</span></button>
      <button class="btn" id="notesBtn" aria-pressed="false" title="발표자 노트 (N)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span class="lbl">발표자 노트</span></button>
      <button class="btn" id="fsBtn" title="전체 화면 (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl">전체 화면</span></button>
      <a class="btn" href="slides/%EC%A0%84%EB%82%A8%EB%A7%A4%EC%9D%BC_AI%ED%8A%B9%EA%B0%95_%EA%B0%9C%EB%85%90%EC%8A%AC%EB%9D%BC%EC%9D%B4%EB%93%9C.pptx" download title="PPTX 내려받기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="lbl">PPTX</span></a>
    </div>
  </header>

  <main>
    <div class="stage" id="stage">
      <div class="frame">
        <img id="slideImg" alt="" src="viewer/slides/slide-01.jpg" width="1920" height="1080">
        <button class="nav prev" id="prev" aria-label="이전 슬라이드"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></span></button>
        <button class="nav next" id="next" aria-label="다음 슬라이드"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></span></button>
      </div>
    </div>
    <aside class="notes" id="notes" aria-live="polite"></aside>
  </main>

  <footer>
    <div class="count" id="count">1 / 34</div>
    <div class="bar" id="bar" title="클릭해서 이동"><i id="barFill"></i></div>
    <div class="hint">← → 이동 · G 목차 · N 노트 · F 전체 화면</div>
  </footer>
</div>

<div class="grid" id="grid" role="dialog" aria-label="슬라이드 목차">
  <div class="grid-head"><b>슬라이드 목차</b><button class="btn" id="gridClose">닫기 (Esc)</button></div>
  <div class="grid-body" id="gridBody"></div>
</div>

<script>
const TITLES = ["표지", "목차", "오늘 사용할 두 가지 도구", "오늘의 진행 방식", "모든 실습의 기본 루프", "1교시 · 검증 편", "AI가 틀리는 세 가지 방식", "팩트 검증 4단계", "AI 오답(환각) 점검 체크리스트", "이미지·영상 진위 확인: 네 가지 단서", "AI 판별 결과는 참고 정보", "1교시 실습 안내", "2교시 · 분석·기획 편", "긴 문서를 AI로 읽는 네 가지 방법", "법령·공문서 분석 워크플로우", "취재 각도를 넓히는 여섯 방향", "막연한 질문 vs 구조화된 질문", "2교시 실습 안내", "3교시 · 인터뷰 편", "인터뷰 질문의 세 층위", "인터뷰 준비 4단계", "외국인 인터뷰, 두 가지 활용법", "번역 검수 원칙", "3교시 실습 안내", "4교시 · 책임·실행 편", "보도 현장의 AI 사용 원칙", "AI에 넣지 말아야 할 정보", "저작권·이용 유의점", "AI에게 일 시키는 프롬프트 4요소", "같은 업무, 다른 지시", "반복 업무를 템플릿으로", "4교시 실습 안내", "오늘의 핵심 원칙", "감사합니다"];
const SECTIONS = {"1": "시작", "6": "1교시 · 검증", "13": "2교시 · 분석·기획", "19": "3교시 · 인터뷰", "25": "4교시 · 책임·실행", "33": "마무리"};
const NOTES = ["【발표 스크립트】\n안녕하세요. 오늘 'AI 시대, 기자를 위한 취재·검증 실무' 특강을 맡은 손준수입니다.\n오늘은 네 시간 동안 ChatGPT와 Claude, 딱 두 가지 도구만 가지고 취재하고, 검증하고, 인터뷰하고, 기사를 쓰는 실제 흐름에 AI를 붙여 보겠습니다.\n수업은 제가 직접 화면으로 시연하는 방식으로 진행합니다. 유료 기능도 제 계정으로 보여 드릴 테니, 계정이 없으셔도 괜찮습니다.\n오늘 보여 드리는 프롬프트는 전부 노션 공유 페이지에 정리해 두었습니다. 보시면서 따라 하셔도 좋고, 오늘은 보기만 하시고 나중에 그대로 재현하셔도 됩니다.\n\n【진행 메모】\n[인사·소개 2분]\n- 강사 소개, 오늘 과정 목표: 취재·검증·인터뷰·기사 작성 흐름에 AI를 붙이는 법\n- 오늘은 ChatGPT와 Claude 두 도구만 사용합니다. 유료 기능은 강사 계정으로 시연하고, 모든 프롬프트는 노션 공유 페이지에 있습니다.\n- 노트북을 펴고 따라 하셔도 되고, 보기만 하셔도 사후 자료로 그대로 재현할 수 있게 설계했습니다.", "【발표 스크립트】\n오늘 순서입니다. 1교시는 검증 편입니다. AI로 기사 속 주장과 수치를 검증하고, 이미지와 영상의 진위를 확인하는 방법을 봅니다.\n2교시는 분석·기획 편입니다. 법령이나 공문서처럼 긴 문서를 AI로 읽고, 취재 아이디어를 넓히는 방법을 다룹니다.\n3교시는 인터뷰 편입니다. 인터뷰 질문을 설계하고, 외국인 인터뷰에서 통역과 번역을 활용해 봅니다.\n4교시는 책임·실행 편입니다. AI에 무엇을 넣으면 안 되는지, 저작권과 표기는 어떻게 할지 정리하고, 반복 업무를 AI에게 맡기는 방법으로 마무리합니다.\n교시마다 개념은 10분 안팎으로 짧게 하고, 나머지는 실습 시연으로 채우겠습니다.\n\n【진행 메모】\n[1분] 4교시 × 50분 구성. 각 교시는 개념 10분 내외 + 실습 시연 35분 내외 + 질문 5분으로 운영합니다.\n교시마다 실습 5개, 총 20개 실습을 시연합니다.", "【발표 스크립트】\n오늘 쓰는 두 도구를 먼저 소개하겠습니다.\nChatGPT는 웹 검색과 딥 리서치로 최신 정보를 찾는 데 편하고, 음성 모드로 짧은 대화를 통역하거나, 이미지를 분석하고 만드는 일에 강합니다. 말하자면 현장형 도구입니다.\nClaude는 긴 PDF나 공문서를 꼼꼼하게 읽고 조항 단위로 정리하는 데 강하고, 한국어 문장을 자연스럽게 다듬어 주며, 아티팩트라는 기능으로 표나 인포그래픽을 바로 만들어 줍니다. 데스크형 도구에 가깝습니다.\n다만 오늘 꼭 기억하실 점이 있습니다. 둘 중 무엇이 더 좋으냐보다, 같은 질문을 두 도구에 던져서 답을 비교하는 것 자체가 가장 쉬운 검증 방법이라는 점입니다.\n\n【진행 메모】\n[2분] 두 도구를 경쟁 관계가 아니라 역할 분담으로 소개합니다.\n- ChatGPT: 검색·음성·이미지 등 \"멀티모달 현장 도구\"\n- Claude: 긴 문서·문장·정리 산출물에 강한 \"데스크 도구\"\n- 실제로는 둘 다 웹 검색·파일 업로드가 되므로, 같은 질문을 두 모델에 던져 교차 확인하는 것 자체가 검증 방법이라는 점을 강조합니다.\n※ 메뉴 이름·요금제별 기능은 자주 바뀌므로 수업 전날 강사 계정에서 화면을 다시 확인하세요.", "【발표 스크립트】\n진행 방식을 표로 정리했습니다. 50분씩 네 교시, 교시마다 실습 다섯 개, 모두 스무 개의 실습을 보여 드립니다.\n모든 실습은 같은 흐름입니다. 제가 시연하고, 원하시는 분은 노션 공유 페이지의 프롬프트를 복사해서 따라 하시고, 끝난 뒤에는 사후 과제로 본인 업무에 적용해 보시는 겁니다.\n지금 화면의 링크, 또는 QR로 노션 공유 페이지를 열어 두시면 이후 진행이 훨씬 편합니다.\n\n【진행 메모】\n[1분] 진행 방식 안내. 모든 실습은 \"강사 시연 → (가능한 분은) 따라 하기 → 노션 사후 과제\"로 이어집니다.\n노션 공유 페이지 링크를 이 시점에 채팅/QR로 공유하세요.", "【발표 스크립트】\n오늘 스무 개 실습은 모두 이 네 단계를 반복합니다.\n첫째, 지시입니다. 역할과 맥락, 원하는 형식을 담아 AI에게 요청합니다.\n둘째, 생성입니다. AI가 초안이나 목록, 표를 빠르게 만들어 줍니다.\n셋째, 검증입니다. 여기가 핵심입니다. 출처 링크와 원문은 AI가 아니라 기자가 직접 엽니다.\n넷째, 기록입니다. 무엇을 AI로 했고, 무엇을 직접 확인했는지 남겨 둡니다.\nAI는 2단계를 빠르게 해 줄 뿐이고, 3단계는 여전히 기자의 몫이라는 것, 이게 오늘 전체를 관통하는 메시지입니다.\n\n【진행 메모】\n[1분] 오늘 20개 실습은 모두 이 네 단계를 반복합니다.\n특히 3단계 \"검증\"을 AI가 아니라 기자가 한다는 점이 오늘의 전체 메시지입니다.", "【발표 스크립트】\n1교시, 검증 편을 시작하겠습니다.\nAI는 정말 빨리 찾아 줍니다. 그런데 찾아 준 것이 사실이라는 보증까지 해 주지는 않습니다.\n그래서 이번 교시의 원칙은 단순합니다. 주장을 쪼개고, 출처를 열고, 판정은 원문을 확인한 기자가 내린다. 이 흐름을 실습 다섯 개로 직접 보여 드리겠습니다.\n\n【진행 메모】\n[1교시 시작] 개념 약 10분 → 실습 1-1~1-5 시연 약 35분 → 질문 5분", "【발표 스크립트】\n먼저 AI가 어떻게 틀리는지부터 알아야 잡을 수 있습니다. 크게 세 가지입니다.\n첫째는 환각입니다. 존재하지 않는 통계, 기사, 판결을 아주 그럴듯하게 만들어 냅니다. 대응은 간단합니다. 출처 링크를 직접 여는 겁니다.\n둘째는 시점 오류입니다. 이미 바뀐 수치나 제도를 최신 정보처럼 답합니다. 그래서 질문할 때 '기준일'을 함께 물어야 합니다.\n셋째가 가장 위험한 출처 왜곡입니다. 링크는 진짜인데, 그 링크 본문에는 없는 내용을 인용한 것처럼 씁니다. 링크가 붙어 있으니 믿기 쉽죠. 인용 문장을 원문에서 직접 찾아봐야 합니다.\n결론은 하나입니다. 검색 연동 모델도 틀립니다. AI 답은 초안이고, 판정은 기자가 합니다.\n\n【진행 메모】\n[3분] 세 가지 오류 유형을 실제 사례처럼 설명합니다.\n- 환각: 존재하지 않는 보고서명·조항 번호\n- 시점 오류: 이전 연도 통계를 올해 수치처럼\n- 출처 왜곡: 링크는 실재하지만 본문에 그 수치가 없음 (가장 위험)\n→ 실습 1-3에서 일부러 환각을 유도해 확인합니다.", "【발표 스크립트】\n그래서 팩트 검증은 네 단계로 하겠습니다.\n1단계, 주장 분해. 기사나 보도자료를 검증 가능한 주장, 수치, 인용 단위로 쪼갭니다.\n2단계, 교차 확인. 같은 주장을 ChatGPT와 Claude 검색에 각각 넣어 출처를 찾습니다.\n3단계, 원문 열기. 나온 링크를 직접 열어서 그 문장과 숫자가 정말 있는지 봅니다.\n4단계, 판정과 기록. '사실', '부분 사실', '확인 불가'처럼 표시하고 근거를 남깁니다.\n잠시 뒤 실습 1-1과 1-2가 정확히 이 순서대로 진행됩니다.\n\n【진행 메모】\n[2분] 실습 1-1(주장 분해), 1-2(교차 확인)가 이 흐름 그대로입니다.\n\"판정\"은 3단계 표시(사실/부분 사실/확인 불가)를 권장 — 이분법보다 데스크 소통이 쉽습니다.", "【발표 스크립트】\n이 체크리스트는 노션에 그대로 들어 있으니 출력해서 모니터 옆에 붙여 두셔도 좋습니다.\n원칙은 하나입니다. 링크를 열기 전에는 사실이 아니다. AI가 붙인 출처는 '후보'일 뿐입니다.\n출처 체크는 세 가지입니다. 링크가 실제로 열리는가, 그 수치와 문장이 원문에 그대로 있는가, 발표 기관과 날짜가 맞는가.\n교차 체크도 세 가지입니다. 다른 모델도 같은 답을 내는가, 프롬프트에 '모르면 모른다고 답하라'고 지시했는가, 기관 원문 같은 1차 자료까지 거슬러 올라갔는가.\n특히 '모르면 모른다고 답하라'는 한 줄이 결과를 꽤 바꿉니다. 실습 1-3에서 직접 비교해 보겠습니다.\n\n【진행 메모】\n[2분] 이 체크리스트는 노션 공유 페이지에 그대로 들어 있습니다.\n프롬프트에 \"모르면 모른다고 답하라, 추측 금지\"를 넣는 것만으로도 환각이 눈에 띄게 줄어든다는 점을 실습 1-3에서 비교 시연합니다.", "【발표 스크립트】\n이제 이미지와 영상입니다. 여기서도 원칙은 같습니다. AI에게 '이거 진짜야, 가짜야?'라고 묻지 않습니다. '이 사진을 검증하려면 뭘 확인해야 해?'라고 묻습니다.\n볼 단서는 네 가지입니다. 빛과 그림자 방향이 서로 맞는지, 간판이나 번호판, 현수막의 글자가 뭉개지거나 엉뚱하지 않은지, 손가락이나 귀, 안경처럼 부자연스러운 디테일이 없는지, 그리고 최초 게시자와 게시 시점, C2PA라는 콘텐츠 출처 정보가 있는지입니다.\nAI는 이 단서들을 빠르게 목록으로 만들어 주고, 우리는 그 목록을 들고 확인 취재를 하는 겁니다.\n\n【진행 메모】\n[2분] AI에게 \"진짜냐 가짜냐\"를 묻지 말고 \"확인해야 할 단서 목록\"을 만들게 합니다. (실습 1-4)\nC2PA: 일부 생성 도구가 붙이는 출처 메타데이터. contentcredentials.org/verify 에서 확인 가능하지만 캡처·재업로드 시 사라질 수 있습니다.", "【발표 스크립트】\n여기서 오해하기 쉬운 부분이 있습니다. AI 판별 결과는 결론이 아니라 참고 정보입니다.\nChatGPT나 Claude에 이미지를 넣으면 보이는 단서를 잘 정리해 줍니다. 하지만 'AI가 만든 이미지냐'는 질문에는 자주 틀립니다. 확신을 갖고 틀리는 경우도 많습니다.\n일부 생성 도구는 C2PA라는 출처 정보를 이미지에 붙이는데, 캡처하거나 다시 올리거나 편집하면 쉽게 사라집니다. 그리고 그 정보가 없다고 해서 실제 사진이라는 뜻도 아닙니다.\n그래서 순서는 이렇습니다. AI로 단서를 목록화하고, 최초 게시자와 원본을 추적하고, 촬영자와 현장을 확인합니다. 끝내 확인되지 않으면 '진위가 확인되지 않은 이미지'로 표기하거나 쓰지 않습니다.\n\n【진행 메모】\n[2분] 실습 1-5에서 ChatGPT로 이미지를 직접 생성한 뒤, 그 이미지를 다시 ChatGPT·Claude에 넣어 판별을 요청해 봅니다.\n판별이 엇갈리거나 확신하는 오답이 나오는 장면 자체가 교육 포인트입니다.", "【발표 스크립트】\n그럼 실습으로 넘어가겠습니다. 1교시 실습은 다섯 개입니다.\n1-1은 보도자료 속 주장을 쪼개는 실습, 1-2는 그 주장을 ChatGPT와 Claude로 교차 검증하는 실습, 1-3은 일부러 환각을 유도해서 잡아내는 실습입니다.\n1-4는 사진 속 단서를 목록으로 만드는 실습, 1-5는 제가 AI로 만든 이미지를 다시 AI에게 판별시켜 보는 실험입니다.\n노션 공유 페이지에서 '실습 1-1'을 열어 주세요. 바로 시작하겠습니다.\n\n【진행 메모】\n[실습 35분] 노션 \"수업교안(강사용)\" 1-1~1-5 페이지를 옆 화면에 띄우고 시연합니다.\n각 실습 약 7분. 시간이 부족하면 1-5를 축약(생성 → 판별 1회)합니다.", "【발표 스크립트】\n2교시, 분석·기획 편입니다.\n법령, 조례, 판결문, 공문서처럼 길고 딱딱한 문서는 AI가 먼저 읽게 하고, 쟁점은 기자가 고르는 방식으로 일하겠습니다.\n그리고 이번 교시에서 요약보다 더 중요하게 보실 것은 원문 대조입니다. AI가 인용한 조항이 정말 그 조항인지, 끝까지 확인하는 습관입니다.\n\n【진행 메모】\n[2교시 시작] 개념 약 10분 → 실습 2-1~2-5 시연 약 35분 → 질문 5분", "【발표 스크립트】\n긴 문서를 AI로 읽는 방법은 네 가지로 정리할 수 있습니다.\n첫째, 핵심 요약. 조항과 쟁점을 한 장으로 정리합니다.\n둘째, 쟁점화. 이 문서로 누가 이득을 보고 누가 부담을 지는지 뽑아냅니다. 기사의 '사람' 각도가 여기서 나옵니다.\n셋째, 개정 비교. 개정 전후를 비교하는 신구 조문 대비표를 만듭니다.\n넷째, 취재 질문. 담당 부처나 당사자에게 물어볼 질문 목록을 뽑습니다.\n가운데 적힌 원칙이 가장 중요합니다. 모든 인용은 원문 조항과 대조합니다.\n\n【진행 메모】\n[2분] 법령·조례·판결문·공문서 PDF를 Claude에 올려 네 가지 산출물을 만듭니다.\n가운데 원칙이 핵심: AI가 인용한 조문 번호와 문구는 반드시 국가법령정보센터 원문과 대조합니다. (실습 2-3)", "【발표 스크립트】\n실제 작업 순서는 이렇습니다.\n먼저 원문을 확보합니다. 국가법령정보센터나 기관 누리집에서 공식 PDF를 내려받습니다. 블로그나 요약본은 쓰지 않습니다.\n다음으로 Claude에 올려서 조항 단위로 요약하고 쟁점을 뽑습니다.\n그다음 개정 전후 비교표와 취재 질문을 만듭니다.\n마지막으로 AI가 인용한 조문 번호와 문구를 원문에서 하나하나 확인합니다.\n실습 2-1부터 2-3까지가 이 네 단계를 한 대화창에서 이어서 진행합니다.\n\n【진행 메모】\n[2분] 원문은 반드시 공식 출처에서 내려받은 파일을 씁니다(블로그·요약본 금지).\n국가법령정보센터의 \"신구법 비교\" 기능과 AI 비교표를 나란히 놓고 대조하는 장면을 실습 2-2에서 보여 줍니다.", "【발표 스크립트】\n이번에는 기획입니다. 이슈 하나를 받았을 때 취재 각도를 넓히는 여섯 방향입니다.\n사람, 누가 영향을 받는가. 돈, 누가 내고 누가 받는가. 제도, 어떤 규정이 바뀌었나. 데이터, 숫자로 확인되는가. 비교, 다른 곳은 어떤가. 시간, 언제부터 어떻게 변했나.\n예시로 농어촌버스 노선 감축을 넣어 봤습니다. 이건 설명용 가상 사례입니다.\n이 여섯 방향을 프롬프트에 그대로 넣으면, 이슈 하나에서 방향별로 세 개씩, 열여덟 개의 각도가 나옵니다. 그중에서 새롭고 취재 가능한 것 하나를 고르는 건 기자의 일입니다.\n\n【진행 메모】\n[2분] 실습 2-4에서 이 6방향 프레임을 프롬프트에 그대로 넣습니다.\n예시 이슈(농어촌버스 노선 감축)는 설명용 가상 사례입니다. 현장에서는 수강생에게 지금 취재 중인 이슈를 하나 받아 바로 넣어 보면 반응이 좋습니다.", "【발표 스크립트】\n왼쪽처럼 '우리 지역 기사 아이디어 좀 줘'라고 물으면, 관광 활성화, 청년 일자리처럼 어느 지역 신문이나 쓸 수 있는 일반론이 돌아옵니다. 지역도, 자료도, 형식도 없는 질문이기 때문입니다.\n오른쪽처럼 역할을 주고, 보도자료를 붙이고, 여섯 방향별로 세 개씩, 확인할 자료와 취재원까지 표로 달라고 하면, 바로 취재 계획이 되는 결과가 나옵니다.\n실습 2-4에서 이 두 질문을 실제로 차례대로 넣어서 차이를 보여 드리겠습니다.\n\n【진행 메모】\n[1분] Before/After를 실제로 두 번 입력해 결과 차이를 보여 주면 가장 설득력이 큽니다. (실습 2-4 첫 장면)", "【발표 스크립트】\n2교시 실습입니다. 2-1부터 2-3까지는 법령 PDF 하나로 요약, 비교표, 원문 대조를 이어서 진행합니다.\n2-4는 방금 본 여섯 방향 프레임으로 아이디어를 넓히고, 2-5는 ChatGPT 딥 리서치로 배경을 조사한 뒤 Claude로 데스크 보고용 취재 계획서를 만듭니다.\n딥 리서치는 시간이 걸리기 때문에 제가 미리 실행해 두었습니다. 노션에서 '실습 2-1'을 열어 주세요.\n\n【진행 메모】\n[실습 35분] 2-1~2-3은 같은 PDF로 이어서 진행합니다(파일 1개 업로드 후 대화 이어가기).\n2-5의 딥 리서치는 5~15분 걸리므로 2-4 시작 전에 미리 돌려 두세요.", "【발표 스크립트】\n3교시, 인터뷰 편입니다.\n좋은 인터뷰는 질문하기 전에 이미 결정됩니다. 사전조사와 질문 설계, 그리고 리허설까지 AI와 함께 해 보겠습니다.\n후반부에는 외국인 인터뷰를 다룹니다. 통역과 녹취 정리는 AI가 빠르게 해 주지만, 검수까지 해야 한 세트라는 점을 함께 보겠습니다.\n\n【진행 메모】\n[3교시 시작] 개념 약 10분 → 실습 3-1~3-5 시연 약 35분 → 질문 5분", "【발표 스크립트】\n인터뷰 질문은 세 층으로 나눠 생각하면 편합니다.\n첫째, 핵심 질문입니다. 기사의 방향을 결정하는 질문으로, 세 개 이내로 줄입니다. 기준은 '이 질문의 답 하나로 리드를 쓸 수 있는가'입니다.\n둘째, 후속 질문입니다. 예상 답변별로 '왜, 언제, 얼마나'를 미리 준비해 둡니다. 모호한 답이 나왔을 때 구체화하는 질문입니다.\n셋째, 반론 질문입니다. 비판하는 쪽의 주장을 근거와 함께 정중하게 묻습니다. 공격이 아니라 확인입니다.\nAI는 예상 답변을 가정해서 후속 질문을 늘리는 데 특히 강합니다. 그리고 마지막에는 AI를 인터뷰이로 세워서 리허설까지 해 보겠습니다.\n\n【진행 메모】\n[3분] 실습 3-2에서 Claude로 3층 질문지를 만들고, 3-3에서 ChatGPT를 인터뷰이로 세워 리허설합니다.\n반론 질문은 \"~라는 지적이 있는데 어떻게 보십니까\"처럼 근거 제시형으로 다듬게 하는 것이 포인트.", "【발표 스크립트】\n인터뷰 준비는 네 단계입니다.\n1단계 사전조사, 인터뷰 대상의 공개 발언과 이력, 쟁점을 한 페이지 브리프로 만듭니다. 이때 출처 링크가 반드시 달려 있어야 합니다. 인물 정보는 경력 연도나 발언 날짜가 틀리는 환각이 특히 잦습니다.\n2단계 질문 설계, 방금 본 세 층 구조로 질문지를 짭니다.\n3단계 리허설, AI가 인터뷰이 역할을 하면서 답을 피하고, 우리는 그걸 뚫는 연습을 합니다.\n4단계 현장과 정리, 녹취를 텍스트로 바꾸고 요약과 번역을 한 뒤 원문과 검수합니다.\n\n【진행 메모】\n[2분] 사전조사 브리프는 반드시 출처 링크가 달린 형태로 받습니다. 인물 정보는 환각이 특히 잦습니다(경력·발언 날짜).", "【발표 스크립트】\n외국인 인터뷰에서는 AI를 두 가지 방식으로 씁니다.\n왼쪽은 현장 통역입니다. ChatGPT 음성 모드로 짧은 대화를 실시간으로 통역합니다. 핵심 질문은 미리 번역해 두고, 고유명사와 숫자는 화면 텍스트로 다시 확인합니다. 그리고 민감한 인터뷰는 전문 통역이 우선입니다.\n오른쪽은 녹취 정리입니다. 녹음 파일을 텍스트로 바꾸고, Claude로 번역과 요약을 하되 원문을 나란히 남깁니다. 인용할 문장은 원어 녹음과 다시 대조하고, 고유명사, 수치, 뉘앙스를 목록으로 검수합니다.\n실습 3-4가 왼쪽, 3-5가 오른쪽입니다.\n\n【진행 메모】\n[2분] 현장 통역은 \"짧은 대화\" 수준까지만 권장합니다. 지연·오역 가능성을 실습 3-4에서 직접 보여 줍니다.\n녹취 정리는 실습 3-5에서 가상 영어 인터뷰 녹취록으로 진행합니다.", "【발표 스크립트】\n번역 검수의 원칙은 '인용은 원문과 함께 남긴다'입니다.\nAI 번역은 매끄러울수록 오히려 의심해야 합니다. 매끄럽게 만드는 과정에서 원래 말의 강도나 조건이 빠지는 경우가 많기 때문입니다.\n반드시 확인할 것은 세 가지입니다. 고유명사, 즉 인명, 지명, 기관명 표기. 수치, 즉 단위와 자릿수, 통화. 그리고 뉘앙스, 존칭이나 완곡어, 반어 같은 표현입니다.\nAI에게도 검수를 시킬 수 있습니다. 번역문과 원문을 표로 나란히 놓게 하고, 의미가 여러 갈래인 표현에 표시하게 하고, 확신이 낮은 부분은 '확인 필요'로 적게 하는 겁니다.\n\n【진행 메모】\n[2분] 실습 3-5의 프롬프트에 오른쪽 \"검수 요청\" 3가지가 그대로 들어 있습니다.", "【발표 스크립트】\n3교시 실습입니다. 3-1은 인터뷰 대상의 사전조사 브리프, 3-2는 핵심·후속·반론 질문 설계, 3-3은 AI 인터뷰이와의 리허설입니다.\n3-4는 ChatGPT 음성 모드로 실시간 통역을 해 보고, 3-5는 영어 인터뷰 녹취록을 Claude로 번역하고 검수합니다.\n3-3과 3-4는 음성을 쓰기 때문에 소리가 함께 나갑니다. 노션에서 '실습 3-1'을 열어 주세요.\n\n【진행 메모】\n[실습 35분] 3-3·3-4는 음성 기능이 필요합니다. 강의장 스피커·마이크 연결을 쉬는 시간에 미리 점검하세요.\n음성이 안 되면 텍스트 모드로 동일하게 진행할 수 있습니다(강사용 페이지 대체안 참고).", "【발표 스크립트】\n마지막 4교시, 책임·실행 편입니다.\nAI를 잘 쓰는 첫 번째 방법은 무엇을 넣지 말아야 하는지 아는 것입니다.\n그 기준을 먼저 세우고, 그다음에 반복 업무를 AI에게 맡기는 구조를 만들어 보겠습니다.\n\n【진행 메모】\n[4교시 시작] 개념 약 12분 → 실습 4-1~4-5 시연 약 30분 → 마무리·Q&A 8분", "【발표 스크립트】\n보도 현장의 AI 사용 원칙을 숫자 네 개로 기억해 주세요.\n0건. 취재원의 실명, 연락처, 제보 내용은 비식별화하기 전에는 한 건도 입력하지 않습니다.\n100%. AI가 정리한 인용과 수치는 전부 원문에서 다시 확인합니다.\n1줄. 독자가 알아야 할 수준으로, AI를 활용한 사실을 사내 기준에 맞춰 밝힙니다.\n2단계. 작성 기자와 데스크가 각각 확인한 뒤에 출고합니다.\n참고로 유료나 기업용 계정에 '학습 제외' 설정이 있더라도, 그게 취재원 정보를 넣어도 된다는 뜻은 아닙니다.\n\n【진행 메모】\n[2분] 숫자로 기억하게 만드는 슬라이드. \"0건·100%·1줄·2단계\".\n유료·기업용 계정의 \"학습 제외\" 설정이 있더라도 취재원 정보 입력이 허용된다는 뜻은 아니라는 점을 강조합니다.", "【발표 스크립트】\nAI에 넣지 말아야 할 정보는 네 가지입니다.\n취재원 정보, 제보자 실명과 연락처는 물론이고, 조합하면 신원이 드러나는 정황 정보도 포함됩니다.\n미공개 자료, 엠바고가 걸린 보도자료, 입수한 문건, 출고 전 기사 원고입니다.\n개인정보, 주민번호, 주소, 병력 같은 민감정보가 담긴 판결문이나 공문서입니다.\n내부 정보, 회사 내부 문서, 계정과 비밀번호, 그리고 취재 계획입니다.\n실무 원칙은 '내가 먼저 지우고 넣는다'입니다. AI에게 지워 달라고 넣는 순간 이미 넣은 것이기 때문입니다.\n\n【진행 메모】\n[2분] 실습 4-1에서 가상의 취재 메모를 Claude로 비식별화하는 과정을 보여 줍니다.\n단, 비식별화 작업 자체도 원본을 AI에 넣는 행위이므로, 실무에서는 \"내가 먼저 지우고 넣는다\"가 원칙입니다. 실습은 가상 메모로만 진행합니다.", "【발표 스크립트】\n저작권과 이용에 대해서는 세 가지만 짚겠습니다.\n첫째, 생성물 저작권입니다. 현재 국내 안내서 기준으로 AI가 단독으로 만든 결과물은 저작권 보호를 받기 어렵습니다. 기사의 핵심 이미지는 직접 촬영하는 것이 안전합니다.\n둘째, 이미지와 영상 이용입니다. 실존 인물이나 실제 사건을 AI로 재현한 이미지를 실제 사진처럼 쓰지 않습니다. 쓴다면 '재현 이미지'라고 분명히 밝힙니다.\n셋째, AI 활용 표기입니다. AI가 기여한 부분을 독자에게 알리고, 표기 문구는 사내에서 통일하는 것이 좋습니다.\n이 내용을 바탕으로 실습 4-2에서 부서 가이드 초안을 함께 만들어 보겠습니다. 구체적인 법적 판단은 사내 법무 확인을 권해 드립니다.\n\n【진행 메모】\n[2분] 저작권은 법적 판단이 필요한 영역이므로 \"현재 국내 가이드라인 기준 일반론\"으로만 설명하고, 구체 사안은 사내 법무 확인을 권합니다.\n(참고: 문화체육관광부·한국저작권위원회 생성형 AI 저작권 안내서)", "【발표 스크립트】\n이제 AI에게 일을 시키는 방법입니다. 프롬프트는 네 가지 요소로 짜면 됩니다.\n역할, 누구의 관점으로 일할지 정해 줍니다. 예를 들어 '지역 일간지 경제부 기자'.\n맥락, 독자는 누구인지, 어떤 매체인지, 어떤 자료를 바탕으로 하는지 알려 줍니다.\n산출물 형식, 표인지 기사인지, 분량과 문체까지 구체적으로 정합니다.\n검증 기준, 출처 표시를 어떻게 할지, 하지 말아야 할 것은 무엇인지, 확인이 필요한 부분은 어떻게 표기할지 정합니다.\n사실 오늘 보신 스무 개 실습 프롬프트가 전부 이 네 요소로 짜여 있었습니다.\n\n【진행 메모】\n[2분] 오늘 실습 프롬프트가 모두 이 4요소로 짜여 있다는 점을 되짚습니다. (역할·맥락·형식·검증)", "【발표 스크립트】\n같은 보도자료로 비교해 보겠습니다.\n왼쪽처럼 '이 보도자료 기사로 써 줘' 한 줄이면, 분량도 문체도 검증 기준도 없으니 '지역 발전의 새로운 이정표' 같은 홍보 문구가 그대로 남은 초안이 나옵니다.\n오른쪽처럼 기자 역할, 독자, 분량, 출처 표시, 그리고 '추가 확인 필요' 목록까지 지정하면 데스크에 바로 올릴 수 있는 초안이 나옵니다.\n도구를 바꾸는 것보다 지시를 바꾸는 쪽이 효과가 훨씬 큽니다. 실습 4-3에서 두 도구에 각각 넣어 네 가지 결과를 비교해 보겠습니다.\n\n【진행 메모】\n[1분] 실습 4-3에서 같은 가상 보도자료로 Before/After를 ChatGPT와 Claude에 각각 입력해 4개 결과를 비교합니다.", "【발표 스크립트】\n잘 만든 프롬프트를 매번 붙여 넣을 필요는 없습니다. 템플릿으로 만들어 두면 됩니다.\n1단계, 결과가 좋았던 프롬프트를 확정합니다.\n2단계, Claude의 프로젝트나 ChatGPT의 GPT를 만들어 그 프롬프트를 지침으로 등록합니다.\n3단계, 사내 표기 원칙이나 스타일북처럼 공유 가능한 자료를 올려 둡니다.\n4단계, 부서가 함께 씁니다. 그러면 누가 쓰든 같은 품질의 초안이 나옵니다.\n팀 공유 기능은 요금제에 따라 다르니, 개인 계정이라면 지침 텍스트만 공유하셔도 충분합니다.\n\n【진행 메모】\n[2분] 실습 4-4에서 \"보도자료 → 기사 초안\" 프로젝트를 실제로 만듭니다.\n팀 공유 기능은 요금제(팀·엔터프라이즈)에 따라 다르므로 개인 계정에서는 \"지침 텍스트를 공유\"하는 방식으로 대체 가능합니다.", "【발표 스크립트】\n4교시 실습입니다. 4-1은 가상 취재 메모에서 민감정보를 걸러내는 실습, 4-2는 부서 AI 사용 가이드 초안 만들기입니다.\n4-3은 프롬프트 Before/After 비교, 4-4는 보도자료만 넣으면 기사 초안이 나오는 템플릿 만들기, 4-5는 Claude 아티팩트로 인포그래픽을, ChatGPT로 카드뉴스 표지를 만드는 실습입니다.\n노션에서 '실습 4-1'을 열어 주세요.\n\n【진행 메모】\n[실습 30분] 4-4는 프로젝트 생성 화면을 미리 열어 두면 시간을 아낄 수 있습니다.\n시간이 부족하면 4-5는 Claude 아티팩트 인포그래픽 1건만 시연합니다.", "【발표 스크립트】\n오늘 내용을 동사 네 개로 정리하겠습니다.\n쪼갠다. 기사와 문서를 검증 가능한 단위로 나눠서 묻습니다.\n연다. AI가 붙인 출처와 인용은 원문을 직접 열어 확인합니다.\n지킨다. 취재원과 미공개 정보는 넣지 않고, AI를 활용한 사실은 밝힙니다.\n맡긴다. 역할, 맥락, 형식, 검증 기준을 갖춘 지시로 반복 업무를 맡깁니다.\nAI는 취재를 대신하지 않습니다. 취재의 속도와 범위를 넓혀 줄 뿐입니다.\n노션 공유 페이지 99번에 사후 과제 세 가지가 있습니다. 이번 주 실제 보도자료, 실제 법령, 실제 인터뷰로 한 번씩만 해 보시면 오늘 내용이 몸에 붙을 겁니다.\n\n【진행 메모】\n[마무리 3분] 네 동사(쪼갠다·연다·지킨다·맡긴다)로 요약.\n사후 과제 3종(보도자료 팩트체크, 법령 PDF 요약, 인터뷰 질문 세트) 안내 → 노션 공유 페이지 \"사후 실습 과제\" 참고.", "【발표 스크립트】\n네 시간 동안 함께해 주셔서 감사합니다.\n남은 시간에는 질문을 받겠습니다. 오늘 실습 중에 궁금했던 점, 또는 지금 맡고 계신 취재에 어떻게 적용할 수 있을지 편하게 물어봐 주세요.\n사후 자료는 모두 노션 공유 페이지에 있습니다. 감사합니다.\n\n【진행 메모】\n[Q&A 5분] 자주 나오는 질문 대비는 노션 강사용 \"00. 강의 운영 가이드\" 페이지 하단에 정리되어 있습니다."];
const N = TITLES.length;

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function renderNotes(n){
  const raw = NOTES[n-1] || "";
  const parts = raw.split(/【(.+?)】\n?/).filter(Boolean);
  let html = `<h2>슬라이드 ${n} · ${esc(TITLES[n-1])}</h2>`;
  if (parts.length < 2) { html += `<p>${esc(raw)}</p>`; }
  for (let i = 0; i + 1 < parts.length; i += 2) {
    const memo = parts[i].includes("메모");
    html += `<div class="${memo ? "memo" : ""}"><div class="sec">${esc(parts[i])}</div>` +
      parts[i+1].trim().split(/\n+/).map(l => `<p>${esc(l)}</p>`).join("") + `</div>`;
  }
  $("notes").innerHTML = html;
  $("notes").scrollTop = 0;
}

function go(n, push = true){
  n = Math.max(1, Math.min(N, n));
  cur = n;
  const img = $("slideImg");
  img.src = src(n);
  img.alt = `슬라이드 ${n}: ${TITLES[n-1]}`;
  $("slideTitle").textContent = `${n}. ${TITLES[n-1]}`;
  $("count").textContent = `${n} / ${N}`;
  $("barFill").style.width = `${(n / N) * 100}%`;
  $("prev").disabled = n === 1;
  $("next").disabled = n === N;
  renderNotes(n);
  document.querySelectorAll(".thumb").forEach(t => t.classList.toggle("cur", +t.dataset.n === n));
  if (push) history.replaceState(null, "", `#${n}`);
  [n+1, n-1].forEach(k => { if (k >= 1 && k <= N) { const p = new Image(); p.src = src(k); } });
}

function buildGrid(){
  const body = $("gridBody");
  let html = "";
  TITLES.forEach((t, i) => {
    const n = i + 1;
    if (SECTIONS[n]) html += `<div class="sect">${esc(SECTIONS[n])}</div>`;
    html += `<button class="thumb" data-n="${n}"><img loading="lazy" src="viewer/slides/thumb-${pad(n)}.jpg" alt=""><span><em>${n}</em>${esc(t)}</span></button>`;
  });
  body.innerHTML = html;
  body.addEventListener("click", e => {
    const b = e.target.closest(".thumb"); if (!b) return;
    go(+b.dataset.n); toggleGrid(false);
  });
}

function toggleGrid(force){
  const g = $("grid");
  const open = force ?? !g.classList.contains("open");
  g.classList.toggle("open", open);
  if (open) { const c = g.querySelector(".thumb.cur"); c && c.scrollIntoView({block:"center"}); c && c.focus(); }
}
function toggleNotes(force){
  const el = $("notes");
  const open = force ?? !el.classList.contains("open");
  el.classList.toggle("open", open);
  $("notesBtn").setAttribute("aria-pressed", String(open));
  store.set("jn-notes", open ? "1" : "0");
}
function toggleFs(){
  const app = $("app");
  if (!document.fullscreenElement) {
    (app.requestFullscreen ? app.requestFullscreen() : Promise.reject()).catch(() => app.classList.toggle("fs"));
  } else document.exitFullscreen();
}
document.addEventListener("fullscreenchange", () => $("app").classList.toggle("fs", !!document.fullscreenElement));

$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
$("gridBtn").onclick = () => toggleGrid();
$("gridClose").onclick = () => toggleGrid(false);
$("notesBtn").onclick = () => toggleNotes();
$("fsBtn").onclick = toggleFs;
$("bar").onclick = e => { const r = e.currentTarget.getBoundingClientRect(); go(Math.ceil(((e.clientX - r.left) / r.width) * N)); };

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const gridOpen = $("grid").classList.contains("open");
  switch (e.key) {
    case "ArrowRight": case "PageDown": case " ": if (!gridOpen) { e.preventDefault(); go(cur + 1); } break;
    case "ArrowLeft": case "PageUp": if (!gridOpen) { e.preventDefault(); go(cur - 1); } break;
    case "Home": go(1); break;
    case "End": go(N); break;
    case "g": case "G": toggleGrid(); break;
    case "n": case "N": toggleNotes(); break;
    case "f": case "F": toggleFs(); break;
    case "Escape": if (gridOpen) toggleGrid(false); else $("app").classList.remove("fs"); break;
  }
});

let tx = null, ty = null;
$("stage").addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
$("stage").addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1));
  tx = ty = null;
});
window.addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1)); if (n && n !== cur) go(n, false); });

buildGrid();
toggleNotes(store.get("jn-notes") === "1");
go(parseInt(location.hash.slice(1)) || 1, false);
</script>
</body>
</html>
